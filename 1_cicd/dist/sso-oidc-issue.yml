name: "SSO OIDC issue (Authelia JWKS key + per-service client secrets, sops-encrypted)"

# #1147. Generates, on an EPHEMERAL runner only:
#   - the Authelia OIDC signing key (RSA 4096, PEM);
#   - one random client secret per client in cloud-u-containers infra-sec_authelia/src/oidc-clients.json
#     (client_id + secret_var are read from that PUBLIC file), plus its Authelia pbkdf2-sha512 digest.
# Output, nothing else: PRIVATE repo diegonmarcos/cloud-me-pvt-vault  Identity/sso-oidc/sso-oidc.sops.json, the whole JSON
# sops-encrypted to the fleet age recipient (see .sops.yaml), written with VAULT_WRITE_DEPLOY_KEY (the same
# write deploy key vault-mtls-issue uses). The public repos keep client IDs and redirect URIs only.
# Nothing is printed (secrets are ::add-mask::ed and never echoed), no artifact is uploaded, files live in a
# 0700 tmpfs dir that is shredded at the end. Refuses to overwrite an existing bundle unless rotate=true.
# mode=add (#994): add-only. Decrypts the existing bundle on the runner (SOPS_AGE_KEY) and appends a new secret
# ONLY for clients declared in oidc-clients.json that the bundle lacks; the JWKS key and every existing client
# secret and digest are kept unchanged (1_cicd/src/scripts/sso-oidc-bundle.py add, guarded by
# 9_others/test/sso-oidc-bundle-add.test.sh with mutations). Nothing missing = no commit.
# Delivery of each secret to its service (/run/secrets/<secret_var>, <SVC>_OIDC_CLIENT_SECRET) and flipping
# "enabled" in oidc-clients.json are separate steps that happen after this run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "new = first bundle (or full rotate with rotate=true); add = append secrets for missing clients only, keep every existing secret and the JWKS key"
        required: false
        default: "new"
        type: string
      rotate:
        description: "true = replace an existing bundle (new JWKS key and every client secret)"
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: sso-oidc-issue
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VAULT_WRITE_DEPLOY_KEY: ${{ secrets.VAULT_WRITE_DEPLOY_KEY }}
      ROTATE: ${{ inputs.rotate }}
      MODE: ${{ inputs.mode }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      AGE_RECIPIENT: age1u575hx8h4t5cgle2uznmyfy75e7cgd02h9t5dax506luz9e05vlqxtd7pq
    steps:
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloudy-u-containers
          path: containers
          sparse-checkout: infra-sec_authelia/src/oidc-clients.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          path: self
          sparse-checkout: 1_cicd/src/scripts/sso-oidc-bundle.py
          sparse-checkout-cone-mode: false
      - name: Install sops
        run: |
          set -eu
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version >/dev/null
      - name: Generate key and client secrets, encrypt, publish to the private repo
        run: |
          set -eu
          umask 077
          [ -n "$VAULT_WRITE_DEPLOY_KEY" ] || { echo "::error::VAULT_WRITE_DEPLOY_KEY is not available to this workflow"; exit 1; }
          CLIENTS="$GITHUB_WORKSPACE/containers/infra-sec_authelia/src/oidc-clients.json"
          W="$(mktemp -d -p /dev/shm)"; cd "$W"
          trap 'find "$W" -type f -exec shred -u {} + 2>/dev/null || true; rm -rf "$W" ~/.ssh/id_deploy || true' EXIT
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VAULT_WRITE_DEPLOY_KEY" > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes"
          git clone -q --depth 1 git@github.com:diegonmarcos/cloud-me-pvt-vault.git "$W/pvt"
          BUNDLE_PY="$GITHUB_WORKSPACE/self/1_cicd/src/scripts/sso-oidc-bundle.py"
          B="$W/pvt/Identity/sso-oidc/sso-oidc.sops.json"
          COMMIT_MSG="sso-oidc: JWKS key + client secrets (sops-encrypted)"
          case "${MODE:-new}" in
            add)
              [ -f "$B" ] || { echo "::error::mode=add needs an existing bundle; run mode=new first"; exit 1; }
              [ -n "$SOPS_AGE_KEY" ] || { echo "::error::SOPS_AGE_KEY is not available"; exit 1; }
              sops -d --input-type json --output-type json "$B" > old.json
              rc=0; python3 -I "$BUNDLE_PY" add "$CLIENTS" old.json plain.json || rc=$?
              [ "$rc" -eq 3 ] && { echo "bundle unchanged (nothing to add)."; exit 0; }
              [ "$rc" -eq 0 ] || exit "$rc"
              COMMIT_MSG="sso-oidc: add-only, secrets for newly declared clients (existing secrets + JWKS key kept, sops-encrypted)" ;;
            new)
              if [ -f "$B" ] && [ "$ROTATE" != "true" ]; then
                echo "::error::an SSO OIDC bundle already exists; pass rotate=true to replace the key and every client secret, or mode=add to append missing clients"; exit 1
              fi
              openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out jwks.key 2>/dev/null
              python3 -I "$BUNDLE_PY" new "$CLIENTS" jwks.key plain.json ;;
            *) echo "::error::mode must be new or add"; exit 1 ;;
          esac
          sops --encrypt --age "$AGE_RECIPIENT" --input-type json --output-type json plain.json > sso-oidc.sops.json
          grep -q '"sops"' sso-oidc.sops.json
          if grep -q 'PRIVATE KEY' sso-oidc.sops.json; then echo "::error::plaintext key leaked into the sops file"; exit 1; fi
          mkdir -p "$W/pvt/Identity/sso-oidc" && cp sso-oidc.sops.json "$W/pvt/Identity/sso-oidc/sso-oidc.sops.json"
          printf 'Authelia OIDC JWKS signing key + per-service client secrets and pbkdf2 digests (#1147). sops-encrypted to the fleet age key; decrypt with `sops -d`.\nclients.<client_id>.secret goes to the service as <SVC>_OIDC_CLIENT_SECRET; clients.<client_id>.secret_var names the Authelia secret file; jwks_key_pem is AUTHELIA_OIDC_JWKS_KEY.\n' > "$W/pvt/Identity/sso-oidc/README.txt"
          ( cd "$W/pvt" && git config user.name "Claude" && git config user.email "noreply@anthropic.com" && git add Identity/sso-oidc \
            && git commit -q -m "$COMMIT_MSG" && git push -q origin HEAD:main )
          echo "bundle pushed to cloud-me-pvt-vault/Identity/sso-oidc (encrypted)."
